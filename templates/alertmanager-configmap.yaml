{{- if .Values.alertmanager.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-alertmanager-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: alertmanager
data:
  alertmanager.yml: |
    {{- .Files.Get "files/alertmanager.yml" | nindent 4 }}
  discord.tmpl: |
    {{- .Files.Get "files/discord.tmpl" | nindent 4 }}
{{- end }}
