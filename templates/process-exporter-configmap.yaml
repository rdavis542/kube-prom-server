{{- if .Values.processExporter.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-process-exporter
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: process-exporter
data:
  # One group per executable name. Requiring a non-empty cmdline skips
  # kernel threads (kworker/0:1H etc.), which would otherwise each become
  # their own group.
  process-exporter.yaml: |
    process_names:
      - name: "{{`{{.Comm}}`}}"
        cmdline:
          - ".+"
{{- end }}
