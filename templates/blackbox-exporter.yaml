{{- if .Values.blackboxExporter.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-blackbox-exporter
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: blackbox-exporter
data:
  blackbox.yml: |
    {{- .Files.Get "files/blackbox.yml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus.fullname" . }}-blackbox-exporter
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
      component: blackbox-exporter
  template:
    metadata:
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
        component: blackbox-exporter
      annotations:
        checksum/config: {{ .Files.Get "files/blackbox.yml" | sha256sum }}
    spec:
      containers:
        - name: blackbox-exporter
          image: "{{ .Values.blackboxExporter.image.repository }}:{{ .Values.blackboxExporter.image.tag }}"
          imagePullPolicy: {{ .Values.blackboxExporter.image.pullPolicy }}
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.blackboxExporter.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus.fullname" . }}-blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus.fullname" . }}-blackbox-exporter
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: blackbox-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9115
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "prometheus.selectorLabels" . | nindent 4 }}
    component: blackbox-exporter
{{- end }}
