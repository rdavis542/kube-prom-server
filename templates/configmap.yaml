apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-config
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
    
    rule_files:
      - "/etc/prometheus/alert-rules.yml"
    
    {{- if .Values.alertmanager.enabled }}
    alerting:
      alertmanagers:
        - api_version: v2
          static_configs:
            - targets:
              - {{ include "prometheus.fullname" . }}-alertmanager:{{ .Values.alertmanager.service.port }}
    {{- end }}
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:10090']

      {{- if .Values.alertmanager.enabled }}
      - job_name: 'alertmanager'
        static_configs:
          - targets: ['{{ include "prometheus.fullname" . }}-alertmanager:{{ .Values.alertmanager.service.port }}']
      {{- end }}

      {{- if .Values.nodeExporter.enabled }}
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: {{ include "prometheus.fullname" . }}-node-exporter
            action: keep
      {{- end }}

      {{- if .Values.processExporter.enabled }}
      - job_name: 'process-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: {{ include "prometheus.fullname" . }}-process-exporter
            action: keep
          # Kubernetes node name equals node_uname_info's nodename, which is
          # what the Linux host dashboard's Host dropdown selects on.
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
      {{- end }}
      
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
      
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
      
      - job_name: 'cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      {{- if .Values.kubeStateMetrics.enabled }}
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: {{ include "prometheus.fullname" . }}-kube-state-metrics
            action: keep
      {{- end }}

      {{- if .Values.windowsExporter.enabled }}
      - job_name: 'windows-exporter'
        static_configs:
          - targets:
              {{- range .Values.windowsExporter.targets }}
              - {{ . | quote }}
              {{- end }}
      {{- end }}

      {{- if .Values.routerExporter.enabled }}
      - job_name: 'router-exporter'
        static_configs:
          - targets:
              {{- range .Values.routerExporter.targets }}
              - {{ . | quote }}
              {{- end }}
      {{- end }}

      {{- if .Values.blackboxExporter.enabled }}
      # One job for every probe: the module and display name ride along as
      # target labels, and the probed address becomes the instance label.
      - job_name: 'blackbox'
        metrics_path: /probe
        static_configs:
          {{- range .Values.blackboxExporter.targets }}
          - targets: [{{ .target | quote }}]
            labels:
              module: {{ .module | quote }}
              name: {{ .name | quote }}
              scope: {{ .scope | quote }}
          {{- end }}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [module]
            target_label: __param_module
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: {{ include "prometheus.fullname" . }}-blackbox-exporter:9115

      # The exporter itself (probe counts, config reload status).
      - job_name: 'blackbox-exporter'
        static_configs:
          - targets: ['{{ include "prometheus.fullname" . }}-blackbox-exporter:9115']
      {{- end }}

      {{- if .Values.speedtestExporter.enabled }}
      # The scrape that triggers a new test blocks until the test ends
      # (about 20-40s), so give it most of the interval as timeout.
      - job_name: 'speedtest'
        scrape_interval: 2m
        scrape_timeout: 110s
        static_configs:
          - targets: ['{{ include "prometheus.fullname" . }}-speedtest-exporter:9798']
      {{- end }}

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
  alert-rules.yml: |
    {{- .Files.Get "files/alert-rules.yml" | nindent 4 }}
