{{- if .Values.processExporter.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "prometheus.fullname" . }}-process-exporter
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: process-exporter
spec:
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
      component: process-exporter
  template:
    metadata:
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
        component: process-exporter
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/process-exporter-configmap.yaml") . | sha256sum }}
    spec:
      hostPID: true
      containers:
        - name: process-exporter
          image: "{{ .Values.processExporter.image.repository }}:{{ .Values.processExporter.image.tag }}"
          imagePullPolicy: {{ .Values.processExporter.image.pullPolicy }}
          args:
            - -procfs=/host/proc
            - -config.path=/config/process-exporter.yaml
            - -web.listen-address=:{{ .Values.processExporter.port }}
            # Per-thread metrics multiply series count; per-group totals are enough.
            - -threads=false
            # smaps parsing gives proportional memory but is the most expensive read.
            - -gather-smaps=false
          ports:
            - name: http
              containerPort: {{ .Values.processExporter.port }}
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Needed to read /proc/<pid>/io and /proc/<pid>/fd for processes
              # owned by other users; without them those reads fail per scrape.
              add: ["SYS_PTRACE", "DAC_READ_SEARCH"]
          resources:
            {{- toYaml .Values.processExporter.resources | nindent 12 }}
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: config
          configMap:
            name: {{ include "prometheus.fullname" . }}-process-exporter
{{- end }}
