{{- if .Values.nodeExporter.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "prometheus.fullname" . }}-node-exporter
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
    component: node-exporter
spec:
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
      component: node-exporter
  template:
    metadata:
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
        component: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: "{{ .Values.nodeExporter.image.repository }}:{{ .Values.nodeExporter.image.tag }}"
          imagePullPolicy: {{ .Values.nodeExporter.image.pullPolicy }}
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            # Without the host root mounted, statfs() runs against the
            # container's own filesystem: only / reported, every other host
            # mount (/boot, /mnt/nfsdata, NFS clients) came back device_error.
            - --path.rootfs=/host/root
            - --collector.processes
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|run/user/.+|var/lib/docker/.+|var/lib/kubelet/.+|var/lib/containerd/.+)($|/)
          ports:
            - name: http
              containerPort: 9100
              protocol: TCP
          resources:
            {{- toYaml .Values.nodeExporter.resources | nindent 12 }}
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
{{- end }}