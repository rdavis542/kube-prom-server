prometheus:
  image:
    repository: prom/prometheus
    tag: v3.13.1
    pullPolicy: IfNotPresent
  
  service:
    type: NodePort
    port: 10090
    targetPort: 10090
    nodePort: 30090
  
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: prometheus.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    # PVC request size. This PV is statically provisioned (no StorageClass),
    # so once the PVC is bound this value is immutable - Kubernetes has no
    # resize path without a resizable StorageClass. Must match whatever is
    # already live in the cluster; do not change without deleting and
    # recreating the PVC.
    size: 8Gi
    # Real capacity of the underlying static PV. Independent from the PVC
    # request above - only needs to be >= size.
    pvSize: 20Gi
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  retention: "15d"
  scrapeInterval: "15s"
  evaluationInterval: "15s"

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.12.1
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9100
    targetPort: 9100
  
  resources:
    limits:
      cpu: 200m
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 30Mi

alertmanager:
  enabled: false
  image:
    repository: prom/alertmanager
    tag: v0.33.1
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9093
    targetPort: 9093
  
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

windowsExporter:
  enabled: true
  port: 9182
  # Static scrape targets for windows_exporter instances outside the cluster
  # (no Kubernetes service discovery for these - they're bare hosts). A DHCP
  # IP here will silently go "down" in Prometheus if its lease changes;
  # prefer a DHCP reservation so the address stays stable.
  targets:
    - "192.168.1.100:9182"  # chunk (static)
    - "192.168.1.183:9182"  # mouth (DHCP - verify reservation)

kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.13.0
    pullPolicy: IfNotPresent

  service:
    port: 8080
    targetPort: 8080

  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
