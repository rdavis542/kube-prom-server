prometheus:
  image:
    repository: prom/prometheus
    tag: v3.13.1
    pullPolicy: IfNotPresent
  
  service:
    type: NodePort
    port: 10090
    targetPort: 10090
    nodePort: 30090
  
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: prometheus.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    # PVC request size. This PV is statically provisioned (no StorageClass),
    # so once the PVC is bound this value is immutable - Kubernetes has no
    # resize path without a resizable StorageClass. Must match whatever is
    # already live in the cluster; do not change without deleting and
    # recreating the PVC.
    size: 8Gi
    # Real capacity of the underlying static PV. Independent from the PVC
    # request above - only needs to be >= size.
    pvSize: 20Gi
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  retention: "15d"
  scrapeInterval: "15s"
  evaluationInterval: "15s"

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.12.1
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9100
    targetPort: 9100
  
  resources:
    limits:
      cpu: 200m
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 30Mi

processExporter:
  enabled: true
  image:
    repository: ncabatoff/process-exporter
    tag: v0.8.7
    pullPolicy: IfNotPresent
  port: 9256
  resources:
    limits:
      # Each scrape walks every thread on the host. On the workers (~3,300
      # threads) a 200m limit throttled scrapes to 8-10s, past Prometheus's
      # 10s timeout. Average use is only ~50m; the limit just has to allow
      # the per-scrape burst.
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 48Mi

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.33.1
    pullPolicy: IfNotPresent

  # Discord channel webhook URL, stored in a Secret created by hand so it
  # never lands in git:
  #   kubectl create secret generic alertmanager-discord -n prometheus \
  #     --from-literal=webhook-url='https://discord.com/api/webhooks/...'
  discord:
    existingSecret: alertmanager-discord
    secretKey: webhook-url

  service:
    type: ClusterIP
    port: 9093
    targetPort: 9093
  
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

windowsExporter:
  enabled: true
  port: 9182
  # Static scrape targets for windows_exporter instances outside the cluster
  # (no Kubernetes service discovery for these - they're bare hosts). A DHCP
  # IP here will silently go "down" in Prometheus if its lease changes;
  # prefer a DHCP reservation so the address stays stable.
  targets:
    - "192.168.1.100:9182"  # chunk (static)
    - "192.168.1.183:9182"  # mouth (DHCP - verify reservation)

routerExporter:
  enabled: true
  port: 9100
  # node_exporter running under Entware on the home router (192.168.1.1).
  # Note: this build's netdev collector doesn't report per-interface
  # receive/transmit byte counters - only CPU, memory, load, filesystem,
  # and interface up/down status are available.
  targets:
    - "192.168.1.1:9100"

blackboxExporter:
  enabled: true
  image:
    repository: prom/blackbox-exporter
    tag: v0.29.1
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 20m
      memory: 32Mi
  # Each target is probed every scrape interval with the named module from
  # files/blackbox.yml. "scope" drives the alerts: when every "internet"
  # ping fails at once, one InternetDown alert fires instead of a ProbeFailed
  # per target. Hosts with their own exporter (nodes, chunk, mouth) are left
  # out - HostDown already covers them.
  targets:
    # Internet path: ISP gateway (router WAN next hop) and public resolvers.
    - { name: "ISP gateway",      module: icmp, scope: internet, target: "100.7.47.1" }
    - { name: "Cloudflare DNS",   module: icmp, scope: internet, target: "1.1.1.1" }
    - { name: "Google DNS",       module: icmp, scope: internet, target: "8.8.8.8" }
    - { name: "Google",           module: http_2xx, scope: internet, target: "https://www.google.com" }
    - { name: "Cloudflare",       module: http_2xx, scope: internet, target: "https://www.cloudflare.com" }
    # DNS resolution: the router's resolver (what LAN clients use) and two public ones.
    - { name: "Router DNS",       module: dns, scope: lan,      target: "192.168.1.1" }
    - { name: "Cloudflare DNS",   module: dns, scope: internet, target: "1.1.1.1" }
    - { name: "Google DNS",       module: dns, scope: internet, target: "8.8.8.8" }
    # LAN services.
    - { name: "Router UI",        module: http_2xx_selfsigned, scope: lan, target: "https://192.168.1.1:8443" }
    - { name: "Grafana",          module: http_2xx,            scope: lan, target: "http://192.168.1.22/api/health" }
    - { name: "ArgoCD",           module: http_2xx_selfsigned, scope: lan, target: "https://192.168.1.25/healthz" }
    - { name: "Postgres",         module: tcp_connect,         scope: lan, target: "192.168.1.21:5432" }

speedtestExporter:
  enabled: true
  # Last release is from 2023 (bundles Ookla speedtest CLI 1.2.0). Tested
  # working on this network 2026-11-26.
  image:
    repository: miguelndecarvalho/speedtest-exporter
    tag: v3.5.4
    pullPolicy: IfNotPresent
  # One test moves about 1.7 GB on this ~1 Gbps line (measured 2026-11-26),
  # so every 4 hours is ~10 GB/day, ~300 GB/month.
  testEverySeconds: 14400
  # Ookla server ID to test against (list them with `speedtest -L`). Left
  # empty, the CLI picks the lowest-ping server, which here is Verizon
  # Richmond (30810) - and that server caps downloads at ~515 Mbps on this
  # 1 Gbps line. Measured 2026-11-26 from goonies: FiberLync 890/802,
  # Internet Subway 863/777, VA SkyWire 847/820, Comcast 866/707 (down/up
  # Mbps). If this server is retired, tests fail with speedtest_up=0; pick
  # another from the list.
  server: "39263"  # FiberLync, Orange VA
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 48Mi

kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.13.0
    pullPolicy: IfNotPresent

  service:
    port: 8080
    targetPort: 8080

  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
