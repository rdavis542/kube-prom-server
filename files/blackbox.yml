# blackbox_exporter probe modules. The targets that use them are listed in
# values.yaml under blackboxExporter.targets.
modules:
  # Ping. Pods on this cluster allow unprivileged ICMP sockets
  # (net.ipv4.ping_group_range covers all groups), so no NET_RAW is needed.
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true

  # For LAN services with self-signed certificates (router UI, ArgoCD).
  http_2xx_selfsigned:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      tls_config:
        insecure_skip_verify: true

  # Asks the target resolver for a well-known name.
  dns:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      transport_protocol: udp
      query_name: www.google.com
      query_type: A
      valid_rcodes: [NOERROR]

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
